[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "dshare-cli"
dynamic = ["version"]
description = "Cross-platform command-line client for dShare — type-to-share files and text between devices."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Divyesh Vishwakarma" }]
keywords = ["dshare", "file-sharing", "clipboard", "cli"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]
dependencies = ["requests>=2.31,<3"]

[project.urls]
Homepage = "https://docs.dshare.me"
Repository = "https://github.com/motiedivya/dshare"

[project.scripts]
dshare = "dshare_cli.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dshare_cli"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
root = ".."
git_describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match", "cli-v*"]
